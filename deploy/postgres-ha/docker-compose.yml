# Local PostgreSQL streaming-replication test environment (primary + hot-standby replica).
# IaC artifact for exercising failover LOCALLY; it is NOT production HA (one host, no quorum, no
# automatic failover controller). Bring up:  docker compose -f deploy/postgres-ha/docker-compose.yml up
# Then verify replication:  docker exec pg-ha-replica psql -U ledger -tAc "SELECT pg_is_in_recovery()"  -> t
services:
  primary:
    image: postgres:16-alpine
    container_name: pg-ha-primary
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
      # A dedicated replication role is created by the init script below.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - hot_standby=on
    volumes:
      - ./init-primary.sh:/docker-entrypoint-initdb.d/10-init-primary.sh:ro
      - primary_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  replica:
    image: postgres:16-alpine
    container_name: pg-ha-replica
    user: postgres
    depends_on:
      - primary
    environment:
      PGPASSWORD: replicator
    # On first start, base-backup from the primary into an empty data dir, then run as a hot standby.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          until pg_isready -h primary -U ledger; do sleep 1; done
          pg_basebackup -h primary -U replicator -D "$$PGDATA" -Fp -Xs -P -R
        fi
        exec postgres
    volumes:
      - replica_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

volumes:
  primary_data:
  replica_data:
